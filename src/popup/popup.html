<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>DoomName</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="header">
    <div class="brand">
      <img src="../icons/doomname-logo.svg" alt="" class="brand-icon" />
      <span class="brand-name">DoomName</span>
    </div>
    <button id="open-options" class="icon-btn" title="Réglages" aria-label="Réglages">
      <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <circle cx="8" cy="8" r="2.4" stroke="currentColor" stroke-width="1.3" />
        <path d="M8 1.4v1.3M8 13.3v1.3M1.4 8h1.3M13.3 8h1.3M3.3 3.3l.9.9M11.8 11.8l.9.9M3.3 12.7l.9-.9M11.8 4.2l.9-.9"
              stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
      </svg>
    </button>
  </header>

  <!-- Bandeau e-mail manquant -->
  <div id="setup-banner" class="banner hidden">
    <span>Ajoutez votre e-mail pour activer les alertes.</span>
    <button id="setup-link" class="banner-btn">Configurer</button>
  </div>

  <!-- Onglet courant -->
  <section id="current-card" class="current hidden">
    <div class="current-row">
      <span id="current-domain" class="domain mono"></span>
      <button id="current-watch" class="btn btn-primary btn-sm">Surveiller</button>
    </div>
  </section>

  <!-- Recherche -->
  <section class="search">
    <div class="input-wrap">
      <svg class="input-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <circle cx="7" cy="7" r="4.6" stroke="currentColor" stroke-width="1.4" />
        <path d="M10.4 10.4 14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
      </svg>
      <input id="search-input" type="text" inputmode="url" spellcheck="false"
             autocomplete="off" autocapitalize="off" placeholder="exemple.com" aria-label="Nom de domaine" />
      <span id="search-spinner" class="spinner hidden" aria-hidden="true"></span>
      <button id="search-clear" class="clear-btn hidden" title="Effacer" aria-label="Effacer">×</button>
    </div>
    <p id="search-hint" class="hint hidden"></p>
  </section>

  <!-- Résultats -->
  <section id="results" class="results" aria-live="polite"></section>

  <!-- Historique -->
  <section id="history-section" class="history hidden">
    <div class="history-head">
      <span class="label">Récents</span>
      <button id="history-clear" class="link-btn">Effacer</button>
    </div>
    <div id="history-list" class="chips"></div>
  </section>

  <footer class="footer">
    <a id="link-manage" href="#" class="link-btn">Mes alertes</a>
    <a id="link-site" href="#" class="link-btn">doomname.com ↗</a>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
